name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.8.9", "1.21.1", "1.21.4", "1.21.8", "1.21.10", "1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mc }}
        run: |
          chmod +x gradlew
          ./gradlew ":${{ matrix.mc }}:build"

      - uses: actions/upload-artifact@v4
        with:
          name: keyframe-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
